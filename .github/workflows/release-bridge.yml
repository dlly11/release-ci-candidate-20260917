name: Release event bridge (prototype)
on:
  workflow_run:
    workflows: [CI, PR title]
    branches: ["release-please--branches--main*"]
    types: [in_progress, completed]
  pull_request_target:
    branches: [main]
    types: [closed]
permissions:
  contents: read
jobs:
  publish:
    name: Publish verified release checks
    if: github.event_name == 'workflow_run' && github.event.workflow_run.event == 'workflow_dispatch' && startsWith(github.event.workflow_run.head_branch, 'release-please--branches--main')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      pull-requests: read
      statuses: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - run: python .github/release_bridge.py publish
        env:
          GH_TOKEN: ${{ github.token }}
  dispatch:
    name: Dispatch verified merge processing
    if: github.event_name == 'pull_request_target' && github.event.pull_request.merged == true && contains(github.event.pull_request.title, '[skip ci]')
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - run: python .github/release_bridge.py dispatch
        env:
          GH_TOKEN: ${{ github.token }}
